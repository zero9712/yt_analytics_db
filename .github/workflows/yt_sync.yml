# .github/workflows/yt_sync.yml
# ─────────────────────────────────────────────────────────────────────────────
#  Runs yt_notion_sync.py on the 1st of every month at 09:00 KST (00:00 UTC).
#
#  REQUIRED SECRETS  (Settings → Secrets and variables → Actions)
#  NOTION_TOKEN            → Notion integration token
#  GOOGLE_CLIENT_SECRET_JSON → Full contents of client_secret.json
#  GOOGLE_TOKEN_JSON         → Full contents of token.json
#                              (generate once locally, then paste here)
#
#  NOTE: If your Google OAuth token ever expires, re-run the script locally
#  once to refresh token.json, then update GOOGLE_TOKEN_JSON secret manually.
# ─────────────────────────────────────────────────────────────────────────────

name: YouTube → Notion Sync

on:
  schedule:
    # 1st of every month 00:00 UTC = 09:00 KST
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  sync:
    name: Sync YouTube metrics to Notion
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install \
            google-auth \
            google-auth-oauthlib \
            google-api-python-client \
            notion-client \
            python-dateutil \
            pytz \
            python-dotenv

      - name: Write Google credential files
        env:
          CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
          TOKEN:         ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          echo "$CLIENT_SECRET" > client_secret.json
          echo "$TOKEN"         > token.json

      - name: Write .env
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          echo "NOTION_TOKEN=${NOTION_TOKEN}"                   > .env
          echo "GOOGLE_CLIENT_SECRET_PATH=client_secret.json" >> .env
          echo "GOOGLE_TOKEN_PATH=token.json"                  >> .env

      - name: Run sync
        run: python yt_notion_sync.py
