name: YouTube → Notion Sync

on:
  schedule:
    # 1st of every month 00:00 UTC = 09:00 KST
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  sync:
    name: Sync YouTube metrics to Notion
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade \
            "google-auth>=2.29.0" \
            "google-auth-oauthlib>=1.2.0" \
            "google-api-python-client>=2.126.0" \
            "notion-client==2.2.1" \
            "python-dateutil>=2.9.0" \
            "pytz>=2024.1" \
            "python-dotenv>=1.0.1"

      - name: Write Google credential files
        env:
          CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
          TOKEN:         ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          echo "$CLIENT_SECRET" > client_secret.json
          echo "$TOKEN"         > token.json

      - name: Write .env
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          echo "NOTION_TOKEN=${NOTION_TOKEN}"                   > .env
          echo "GOOGLE_CLIENT_SECRET_PATH=client_secret.json" >> .env
          echo "GOOGLE_TOKEN_PATH=token.json"                  >> .env

      - name: Verify notion-client version
        run: pip show notion-client

      - name: Run sync
        run: python yt_notion_sync.py
